[env:d1_mini]
platform = espressif8266
board = d1_mini
framework = arduino

; Build flags - UPDATED FOR SINGLE STRIP
build_flags = 
  -D LED_PIN=D7
  -D BTN_PIN=D6
  -D F_CPU=80000000L

; Library dependencies
lib_deps =
  fastled/FastLED @ ^3.5.0
  adafruit/Adafruit MPU6050 @ ^2.2.0
  adafruit/Adafruit Unified Sensor @ ^1.1.7
  adafruit/Adafruit BusIO @ ^1.14.1

; Serial monitor options
monitor_speed = 115200

; Upload options
upload_speed = 115200  ; Reduced from 921600 to a more reliable speed
upload_resetmethod = nodemcu

; File system
board_build.filesystem = littlefs

; Flash settings
board_build.flash_mode = dio

; Only include necessary source files and exclude the diagnostic files
build_src_filter = 
  +<AccelerometerHandler.cpp>
  +<ButtonHandler.cpp>
  +<LEDController.cpp>
  +<PowerManager.cpp>
  +<SettingsManager.cpp>
  +<effect_names.cpp>
  +<main.cpp>
  +<Effects/FireEffect.cpp>
  +<Effects/FireEffect1.cpp>
  +<Effects/FireEffect2.cpp>
  +<Effects/PulseEffect.cpp>
  +<Effects/RainbowEffect.cpp>
  +<Effects/StrobeEffect.cpp>
  -<PinIsolationTest.cpp>
  -<TimerConflictTest.cpp>
  -<ESP8266TimerDiagnostic.cpp>
  -<WiFiTimerTest.cpp>
  -<WifiBeaconTest.cpp>
  -<TimerDiagnostic.cpp>